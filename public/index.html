<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nurse Hub AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ---- Your real Supabase project (safe to be public — protected by row-level security) ----
const SUPABASE_URL = "https://zektckfzfsvvknzwsqcn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_jNZfc9TtMNmihCKG3Lybeg_I7YCipDR";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const GEN_SYSTEM_PROMPT = `You are a nursing exam question generator for Zimbabwean nursing students. You will be given source material and must generate multiple-choice questions based ONLY on the content provided.

Rules:
- Do not introduce facts, drugs, dosages, or procedures not present in the source material.
- If the source material is too thin for the requested count, generate as many as you honestly can.
- Phrase question stems using standard exam command verbs: Define, Describe, Outline, State, and Compare and contrast.
- Each question needs exactly 4 options, one correct_index, a one-sentence explanation, and a short topic label.
- Respond with ONLY a raw JSON array, no markdown fences, no preamble. Format:
[{"question":"...","options":["...","...","...","..."],"correct_index":0,"explanation":"...","topic":"..."}]`;

async function callClaude(system, userContent) {
  const response = await fetch("/.netlify/functions/claude-proxy", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system,
      messages: [{ role: "user", content: userContent }],
    }),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error?.message || "AI request failed");
  const textBlock = (data.content || []).find((b) => b.type === "text");
  if (!textBlock) throw new Error("No response text");
  return textBlock.text;
}

function App() {
  const [session, setSession] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [view, setView] = useState("home");

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => {
      setSession(data.session);
      setAuthLoading(false);
    });
    const { data: listener } = supabase.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  if (authLoading) {
    return <div className="min-h-screen flex items-center justify-center text-slate-500">Loading...</div>;
  }

  if (!session) {
    return <AuthScreen />;
  }

  return <MainApp session={session} view={view} setView={setView} />;
}

function AuthScreen() {
  const [mode, setMode] = useState("login"); // login | signup
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [fullName, setFullName] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [message, setMessage] = useState("");

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    setMessage("");
    setLoading(true);
    try {
      if (mode === "signup") {
        const { error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { full_name: fullName } },
        });
        if (error) throw error;
        setMessage("Account created. Check your email to confirm, then log in.");
        setMode("login");
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (err) {
      setError(err.message || "Something went wrong.");
    }
    setLoading(false);
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-6" style={{ backgroundColor: "#0E1614" }}>
      <div className="w-full max-w-sm space-y-6">
        <div className="flex items-center gap-2.5 justify-center">
          <div className="w-8 h-8 rounded-md flex items-center justify-center border" style={{ borderColor: "#C9A227" }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M2 12h4l2-7 4 14 3-9 2 2h5" stroke="#C9A227" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          </div>
          <span className="font-serif text-lg" style={{ color: "#EDEAE2" }}>Nurse Hub AI</span>
        </div>

        <form onSubmit={handleSubmit} className="bg-slate-900 rounded-lg p-5 space-y-3 border border-slate-800">
          {mode === "signup" && (
            <input
              type="text"
              placeholder="Full name"
              className="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-md p-2.5 text-sm"
              value={fullName}
              onChange={(e) => setFullName(e.target.value)}
              required
            />
          )}
          <input
            type="email"
            placeholder="Email"
            className="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-md p-2.5 text-sm"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            required
          />
          <input
            type="password"
            placeholder="Password (min 6 characters)"
            className="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-md p-2.5 text-sm"
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            minLength={6}
            required
          />
          {error && <p className="text-sm text-rose-400">{error}</p>}
          {message && <p className="text-sm text-amber-400">{message}</p>}
          <button
            type="submit"
            disabled={loading}
            className="w-full py-2.5 rounded-md text-sm font-medium text-white disabled:opacity-50"
            style={{ backgroundColor: "#123B36" }}
          >
            {loading ? "Please wait..." : mode === "signup" ? "Create account" : "Log in"}
          </button>
        </form>

        <button
          onClick={() => { setMode(mode === "login" ? "signup" : "login"); setError(""); setMessage(""); }}
          className="w-full text-center text-sm"
          style={{ color: "#9AA39D" }}
        >
          {mode === "login" ? "No account yet? Sign up" : "Already have an account? Log in"}
        </button>
      </div>
    </div>
  );
}

function MainApp({ session, view, setView }) {
  const [subject, setSubject] = useState("");
  const [notes, setNotes] = useState("");
  const [numQuestions, setNumQuestions] = useState(5);
  const [difficulty, setDifficulty] = useState("medium");
  const [questions, setQuestions] = useState([]);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [errorMsg, setErrorMsg] = useState("");
  const [history, setHistory] = useState([]);
  const [historyLoaded, setHistoryLoaded] = useState(false);

  async function loadHistory() {
    setHistoryLoaded(false);
    const { data, error } = await supabase
      .from("exam_attempts")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(20);
    if (!error) setHistory(data || []);
    setHistoryLoaded(true);
  }

  useEffect(() => {
    if (view === "progress") loadHistory();
  }, [view]);

  async function generateQuestions() {
    if (notes.trim().length < 40) {
      setErrorMsg("Paste a bit more material — a couple of sentences isn't enough.");
      return;
    }
    if (!subject.trim()) {
      setErrorMsg("Give this a subject name.");
      return;
    }
    setView("generating");
    setErrorMsg("");
    try {
      const text = await callClaude(
        GEN_SYSTEM_PROMPT,
        `Source material:\n"""${notes}"""\n\nGenerate ${numQuestions} ${difficulty}-difficulty questions from this material only.`
      );
      const cleaned = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);
      if (!Array.isArray(parsed) || parsed.length === 0) throw new Error("Empty question set");
      setQuestions(parsed);
      setAnswers(new Array(parsed.length).fill(null));
      setCurrentIndex(0);
      setView("exam");
    } catch (err) {
      setErrorMsg("Couldn't generate questions. Try again, or use clearer notes.");
      setView("error");
    }
  }

  function selectAnswer(i) {
    const next = [...answers];
    next[currentIndex] = i;
    setAnswers(next);
  }

  async function finishExam() {
    const score = questions.reduce((acc, q, i) => acc + (answers[i] === q.correct_index ? 1 : 0), 0);
    const topicStats = {};
    questions.forEach((q, i) => {
      const t = q.topic || "General";
      if (!topicStats[t]) topicStats[t] = { correct: 0, total: 0 };
      topicStats[t].total += 1;
      if (answers[i] === q.correct_index) topicStats[t].correct += 1;
    });
    await supabase.from("exam_attempts").insert({
      user_id: session.user.id,
      subject: subject.trim(),
      difficulty,
      score,
      total: questions.length,
      topic_stats: topicStats,
      questions: questions.map((q, i) => ({ ...q, student_answer: answers[i] })),
    });
    setView("results");
  }

  function startNew() {
    setSubject("");
    setNotes("");
    setQuestions([]);
    setAnswers([]);
    setErrorMsg("");
    setView("setup");
  }

  const score = questions.reduce((acc, q, i) => acc + (answers[i] === q.correct_index ? 1 : 0), 0);

  return (
    <div className="min-h-screen px-4 py-8 flex justify-center" style={{ backgroundColor: "#0E1614" }}>
      <div className="w-full max-w-sm">
        <div className="flex items-center justify-between mb-5">
          <div className="flex items-center gap-2">
            <div className="w-7 h-7 rounded-md flex items-center justify-center border" style={{ borderColor: "#C9A227" }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path d="M2 12h4l2-7 4 14 3-9 2 2h5" stroke="#C9A227" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </div>
            <span className="font-serif text-lg" style={{ color: "#EDEAE2" }}>Nurse Hub AI</span>
          </div>
          <button onClick={() => supabase.auth.signOut()} className="text-xs" style={{ color: "#9AA39D" }}>Log out</button>
        </div>

        {view === "home" && (
          <div className="space-y-3">
            <button onClick={startNew} className="w-full py-3 rounded-md text-sm font-medium text-white" style={{ backgroundColor: "#123B36" }}>
              Start a new exam
            </button>
            <button onClick={() => setView("progress")} className="w-full py-3 rounded-md text-sm border" style={{ borderColor: "#26302D", color: "#EDEAE2" }}>
              My progress
            </button>
          </div>
        )}

        {view === "setup" && (
          <div className="bg-slate-900 border border-slate-800 rounded-lg p-5 space-y-3">
            <input
              type="text" placeholder="Subject, e.g. Pharmacology"
              className="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-md p-2.5 text-sm"
              value={subject} onChange={(e) => setSubject(e.target.value)}
            />
            <textarea
              placeholder="Paste your notes here..."
              className="w-full h-32 border border-slate-700 bg-slate-800 text-slate-100 rounded-md p-3 text-sm"
              value={notes} onChange={(e) => setNotes(e.target.value)}
            />
            <div className="flex gap-3">
              <select className="flex-1 border border-slate-700 bg-slate-800 text-slate-100 rounded-md p-2 text-sm" value={numQuestions} onChange={(e) => setNumQuestions(Number(e.target.value))}>
                <option value={3}>3</option><option value={5}>5</option><option value={8}>8</option>
              </select>
              <select className="flex-1 border border-slate-700 bg-slate-800 text-slate-100 rounded-md p-2 text-sm" value={difficulty} onChange={(e) => setDifficulty(e.target.value)}>
                <option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option>
              </select>
            </div>
            {errorMsg && <p className="text-sm text-rose-400">{errorMsg}</p>}
            <button onClick={generateQuestions} className="w-full py-2.5 rounded-md text-sm font-medium text-white" style={{ backgroundColor: "#123B36" }}>
              Generate exam
            </button>
            <button onClick={() => setView("home")} className="w-full text-sm py-1" style={{ color: "#9AA39D" }}>Back</button>
          </div>
        )}

        {view === "generating" && (
          <div className="bg-slate-900 border border-slate-800 rounded-lg p-8 text-center">
            <p className="text-sm" style={{ color: "#9AA39D" }}>Building your exam...</p>
          </div>
        )}

        {view === "error" && (
          <div className="bg-slate-900 border border-slate-800 rounded-lg p-5 space-y-3">
            <p className="text-sm text-rose-400">{errorMsg}</p>
            <button onClick={() => setView("setup")} className="w-full py-2.5 rounded-md text-sm font-medium text-white" style={{ backgroundColor: "#123B36" }}>Try again</button>
          </div>
        )}

        {view === "exam" && questions.length > 0 && (
          <div className="bg-slate-900 border border-slate-800 rounded-lg p-5 space-y-4">
            <p className="text-xs" style={{ color: "#9AA39D" }}>{subject} · Question {currentIndex + 1} of {questions.length}</p>
            <p className="text-sm font-medium" style={{ color: "#EDEAE2" }}>{questions[currentIndex].question}</p>
            <div className="space-y-2">
              {questions[currentIndex].options.map((opt, i) => (
                <button
                  key={i} onClick={() => selectAnswer(i)}
                  className="w-full text-left text-sm rounded-md border px-3 py-2.5"
                  style={answers[currentIndex] === i
                    ? { borderColor: "#C9A227", backgroundColor: "#1A2420", color: "#EDEAE2" }
                    : { borderColor: "#26302D", color: "#9AA39D" }}
                >
                  {opt}
                </button>
              ))}
            </div>
            <button
              onClick={() => currentIndex < questions.length - 1 ? setCurrentIndex(currentIndex + 1) : finishExam()}
              disabled={answers[currentIndex] === null}
              className="w-full py-2.5 rounded-md text-sm font-medium text-white disabled:opacity-40"
              style={{ backgroundColor: "#123B36" }}
            >
              {currentIndex < questions.length - 1 ? "Next question" : "See results"}
            </button>
          </div>
        )}

        {view === "results" && (
          <div className="bg-slate-900 border border-slate-800 rounded-lg p-5 space-y-4">
            <div className="text-center">
              <p className="text-3xl font-serif" style={{ color: "#C9A227" }}>{score}/{questions.length}</p>
              <p className="text-sm" style={{ color: "#9AA39D" }}>correct — saved to your progress</p>
            </div>
            <div className="space-y-3">
              {questions.map((q, i) => {
                const correct = answers[i] === q.correct_index;
                return (
                  <div key={i} className="border-t pt-3" style={{ borderColor: "#26302D" }}>
                    <p className="text-sm" style={{ color: "#EDEAE2" }}>{q.question}</p>
                    <p className="text-xs mt-1" style={{ color: correct ? "#C9A227" : "#f87171" }}>
                      {correct ? "Correct" : `Your answer: ${q.options[answers[i]]}`}
                    </p>
                    {!correct && <p className="text-xs" style={{ color: "#9AA39D" }}>Correct: {q.options[q.correct_index]}</p>}
                    <p className="text-xs mt-1" style={{ color: "#9AA39D" }}>{q.explanation}</p>
                  </div>
                );
              })}
            </div>
            <button onClick={startNew} className="w-full py-2.5 rounded-md text-sm font-medium text-white" style={{ backgroundColor: "#123B36" }}>New exam</button>
            <button onClick={() => setView("home")} className="w-full text-sm py-1" style={{ color: "#9AA39D" }}>Home</button>
          </div>
        )}

        {view === "progress" && (
          <div className="bg-slate-900 border border-slate-800 rounded-lg p-5 space-y-3">
            {!historyLoaded && <p className="text-sm" style={{ color: "#9AA39D" }}>Loading...</p>}
            {historyLoaded && history.length === 0 && <p className="text-sm" style={{ color: "#9AA39D" }}>No attempts yet.</p>}
            {history.map((h) => (
              <div key={h.id} className="flex justify-between items-center border-t pt-2 text-sm" style={{ borderColor: "#26302D" }}>
                <div>
                  <p style={{ color: "#EDEAE2" }}>{h.subject}</p>
                  <p className="text-xs" style={{ color: "#9AA39D" }}>{new Date(h.created_at).toLocaleDateString()}</p>
                </div>
                <p style={{ color: "#C9A227" }}>{h.score}/{h.total}</p>
              </div>
            ))}
            <button onClick={() => setView("home")} className="w-full text-sm py-1 mt-2" style={{ color: "#9AA39D" }}>Back</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
